name: Check documentation and playground

on:
  workflow_call:
    inputs:
      source-ref:
        description: Elea commit or ref to build
        required: true
        type: string
      pages-ref:
        description: Documentation source ref
        type: string
        default: gh-pages
      upload-pages:
        description: Upload the tested site for deployment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref }}
          path: elea
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pages-ref }}
          path: pages
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            elea/package-lock.json
            pages/playground/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: elea
      - run: python -m pip install -r requirements.txt
        working-directory: pages
      - run: scripts/build.sh ../elea
        working-directory: pages
      # The runner image already holds the browser's system libraries: only the headless shell is fetched.
      - run: npx playwright install --only-shell chromium
        working-directory: pages/playground
      - run: npm test
        working-directory: pages/playground
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report
          path: pages/playground/playwright-report
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: inputs.upload-pages
        with:
          path: pages/.build/elea
