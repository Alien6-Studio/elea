name: Check documentation and playground

on:
  workflow_call:
    inputs:
      ref:
        description: Elea commit or ref to build
        required: true
        type: string
      upload-site:
        description: Upload the tested site for publication
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/playground/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r site/requirements.txt
      - run: site/scripts/build.sh
      - name: Record the checked-out revision
        run: echo "ELEA_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: site/scripts/browser-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: theme-qualification
          path: site/playground/test-results/**/theme-proof.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report
          path: site/playground/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.upload-site
        with:
          name: site
          path: site/.build/elea
          if-no-files-found: error
          retention-days: 1
