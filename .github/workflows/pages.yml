name: GitHub Pages

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]

permissions:
  contents: read

concurrency:
  group: elea-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/check-pages.yml
    with:
      source-ref: main
      pages-ref: ${{ github.sha }}
      upload-pages: ${{ github.event_name == 'push' }}

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
