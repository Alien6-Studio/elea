version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directories:
      - /
      - /docs/examples/dtcg
      - /site/playground
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
