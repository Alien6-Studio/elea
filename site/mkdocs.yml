site_name: Elea
site_description: Elea is an open-source React design system for rendering, editing and styling rich content.
site_url: https://elea.alien6.com/
repo_name: Alien6-Studio/elea
repo_url: https://github.com/Alien6-Studio/elea
extra:
  source_revision: !ENV ELEA_SOURCE_REVISION
  # Each study is research/<slug>.md; its parts are research/<slug>/<part>.md.
  research:
    - title: Geometry of interfaces
      slug: geometry-of-interfaces
      parts:
        - { title: Atlas, slug: atlas }
        - { title: Laboratory, slug: laboratory }
    - title: Composition of interfaces
      slug: composition-of-interfaces
      parts:
        - { title: Atlas, slug: atlas }
        - { title: Laboratory, slug: laboratory }
    - title: Interaction Observatory
      slug: interaction-observatory
      parts:
        - { title: Atlas, slug: atlas }
        - { title: Laboratory, slug: laboratory }
theme:
  name: null
  custom_dir: overrides
  static_templates:
    - 404.html
plugins:
  - search
hooks:
  - scripts/package_typeface.py
  - scripts/research_redirects.py
  - scripts/observatory_figures.py
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Content: content.md
  - UI integration: components.md
  - Versions: versions.md
exclude_docs: |
  node_modules/
not_in_nav: |
  /typography.md
  /research/
extra_css:
  - assets/elea.css
  - assets/type-roles.css
  - assets/editions.css
  - assets/site-profile.css
  - assets/elea-viewer.css
  - assets/elea-ui.css
  - assets/elea-layout.css
  - assets/brand.css
  - assets/site-search.css
  - assets/site.css
  - assets/research.css
