version: "0.1"
name: elea-qualification
steps:
  qualify:
    run: |-
      set -eu
      npm ci
      npm run check -- --pack-destination artifacts
      npm audit --audit-level=high
      node --version > artifacts/toolchain.txt
    inputs:
      - packages/
      - scripts/
      - .github/release/
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - README.md
      - CHANGELOG.md
      - docs/
      - LICENSE
      - CONTRIBUTING.md
      - SECURITY.md
      - .github/
      - attest.yaml
      - artifacts/source-revision.txt
    outputs:
      - artifacts/
    attestation:
      type: tested-package
